name: pages

on:
  push:
    branches:
      - main
      - master
      - claude/ui-reference-build-st6tul
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Static hosting can't run a route handler, and `output: export` refuses
      # to build with one present. Commands falls back to its offline analysis
      # in this build, which is what NEXT_PUBLIC_STATIC_EXPORT switches on.
      - name: Drop the server-only API route
        run: rm -rf src/app/api

      - name: Build
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_STATIC_EXPORT: "1"
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          npm run build
          touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
