<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1193 437" width="1193" height="437">
  <!--
    INK & GEARS wordmark, traced against the master in Figma (node 137:4).

    Heavy geometric caps, deep 45-degree chamfers running consistently
    top-left / bottom-right, and thin diagonal slices cut through the strokes.
    "INK &" is inset; "GEARS" runs wider beneath it and the two rows nearly
    touch.

    This is a hand trace, not the original artwork — the export URLs are not
    reachable from the build environment. Drop the real export over this file
    and nothing else needs to change.
  -->
  <g fill="#ffffff">
    <!-- ==================== INK & ==================== -->
    <!-- I -->
    <path d="M210 25 H288 V205 H244 L210 171 Z" />
    <!-- N -->
    <path d="M300 25 H358 L462 160 V25 H486 L520 59 V205 H462 L358 70 V205 H300 Z" />
    <!-- K -->
    <path d="M530 25 H588 V96 L662 25 H736 L640 118 L736 205 H660 L588 140 V205 H530 Z" />
    <!-- & -->
    <path
      fill-rule="evenodd"
      d="M846 25 H930 L964 59 V106 L926 139 L978 191 L1000 150 H1046 L1010 205 H938 L918 189 C900 201 884 205 868 205 H818 L784 171 V120 L824 88 L798 62 V51 L846 25 Z
         M848 63 V86 L874 110 L900 87 V63 Z
         M838 129 V149 L860 169 H896 L910 159 L866 113 Z"
    />
    <!-- slice through the ampersand -->
    <path d="M912 22 H934 L862 208 H840 Z" fill="#000000" />
    <!-- detached flag to the right of the ampersand -->
    <path d="M1006 25 H1046 L1012 96 H972 Z" />

    <!-- ==================== GEARS ==================== -->
    <!-- G -->
    <path
      fill-rule="evenodd"
      d="M300 218 H126 L62 282 V342 L126 405 H300 V296 H186 V340 H244 V356 H122 V267 H300 Z"
    />
    <!-- E -->
    <path d="M372 218 H556 L500 267 H432 V292 H540 V330 H432 V356 H556 L500 405 H372 Z" />
    <!-- A -->
    <path
      fill-rule="evenodd"
      d="M628 218 H706 L820 405 H736 L716 370 H612 L592 405 H508 Z
         M636 320 H694 L665 262 Z"
    />
    <!-- R -->
    <path
      fill-rule="evenodd"
      d="M840 218 H1000 L1034 252 V320 L998 344 L1034 405 H952 L920 348 H896 V405 H840 Z
         M896 262 V308 H960 V262 Z"
    />
    <!-- S -->
    <path d="M1076 218 H1188 L1140 267 H1076 V292 H1152 L1186 326 V371 L1152 405 H1040 L1088 356 H1150 V330 H1074 L1040 296 V252 Z" />
    <!-- detached flag above the S -->
    <path d="M1150 218 H1186 L1152 288 H1116 Z" />
  </g>
</svg>
